[package]
name = "deskpilot-macos"
description = "macOS adapter for deskpilot: Accessibility (AXUIElement), CGWindowList, ScreenCaptureKit, CGEvent, Vision, NSPasteboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
deskpilot-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-application-services = { version = "0.3", features = ["libc"] }
objc2-foundation = { version = "0.3", features = ["block2"] }
objc2-app-kit = { version = "0.3", features = ["block2"] }
objc2-screen-capture-kit = { version = "0.3", features = ["block2"] }
objc2-vision = { version = "0.3", features = ["block2"] }
objc2-core-video = "0.3"
